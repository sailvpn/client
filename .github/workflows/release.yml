name: Build and Cross-Platform Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow automatically when you push a tag starting with 'v' (e.g., v1.0.0)
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub Actions tab

jobs:
  build-universal-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission allowing the action to create a release and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle dependencies to drastically speed up future runs

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Fat JAR
        run: ./gradlew bootJar -x test # Generates the Spring Boot executable JAR and skips tests for speed

      - name: Prepare Universal Package Directory
        run: |
          # 1. Create a clean, temporary directory for the final package payload
          mkdir -p release-payload
          
          # 2. Copy and rename the compiled Gradle boot jar into the payload directory
          # This matches the JAR_NAME="app.jar" expected by both sail.sh and sail.bat
          cp build/libs/*.jar release-payload/app.jar
          
          # 3. Copy your 6 requested files from the repository root
          cp LICENSE release-payload/
          cp README.md release-payload/
          cp sail.bat release-payload/
          cp sail.sh release-payload/
          cp sail.service release-payload/
          cp application.properties.txt release-payload/
          
          # 4. CRITICAL Cross-Platform Step: Format line endings for target platforms
          # Convert sail.sh, sail.service, and configuration templates to Unix format (LF)
          sed -i 's/\r$//' release-payload/sail.sh
          sed -i 's/\r$//' release-payload/sail.service
          sed -i 's/\r$//' release-payload/application.properties.txt
          
          # Convert sail.bat to Windows format (CRLF) to guarantee it doesn't break if checked out on Linux
          sed -i 's/$/\r/' release-payload/sail.bat
          sed -i 's/\r\r$/\r/' release-payload/sail.bat # Sanity check to prevent double carriage returns (\r\r\n)
          
          # 5. Ensure the Linux/macOS shell script retains executable permissions inside the package
          chmod +x release-payload/sail.sh

      - name: Compress Bundle into Zip
        run: |
          cd release-payload
          zip -r ../spring-app-universal.zip *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: spring-app-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically injected by GitHub to authenticate the upload
