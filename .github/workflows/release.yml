name: Build and Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-universal-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Fat JAR
        run: ./gradlew bootJar -x test

      - name: Prepare Universal Package Directory
        run: |
          # Create a temporary directory for the final package payload
          mkdir -p release-payload
          
          # 1. Copy the compiled Gradle boot jar into the payload directory
          cp build/libs/*.jar release-payload/app.jar
          
          # 2. Copy the 5 requested files from the repository root
          cp LICENSE release-payload/
          cp README.md release-payload/
          cp sail.bat release-payload/
          cp sail.sh release-payload/
          cp sail.service release-payload/
          
          # 3. Ensure the Linux/macOS shell script retains executable permissions
          chmod +x release-payload/sail.sh

      - name: Compress Bundle into Zip
        run: |
          cd release-payload
          zip -r ../spring-app-universal.zip *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: spring-app-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
