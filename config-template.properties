# Proxy Client Configuration Template
# Copy this file to: src/main/resources/application.properties
# Or create a custom config file and specify with: --spring.config.location=<path>

# ==============================================================================
# BASIC SETTINGS (REQUIRED)
# ==============================================================================

# Enable JWT authentication
params.crypto=JWT

# Remote proxy server address
params.remoteHost=your-server.com
params.remotePort=443

# Local proxy ports
params.localPort=2080    # SOCKS5 proxy port
params.httpPort=9999     # HTTP proxy port


# ==============================================================================
# AUTOMATIC MODE (Single PC - RECOMMENDED)
# ==============================================================================
# Use this mode if:
# - You use the proxy on ONE primary computer
# - You want automatic token renewal
# - You don't need to share tokens with other devices

params.tokenMode=auto
params.username=your_username
params.password=your_password

# Token settings (optional, defaults shown)
# params.tokenExpirationMinutes=43200        # 30 days
# params.tokenRenewalEnabled=true            # Auto-renewal enabled
# params.tokenRenewalIntervalMinutes=10      # Renew every 10 minutes


# ==============================================================================
# MANUAL MODE (Multiple PCs/Family Sharing)
# ==============================================================================
# Use this mode if:
# - You use the proxy on MULTIPLE computers
# - You share the proxy with family members
# - You want the same token on all devices
#
# UNCOMMENT these lines and COMMENT OUT the automatic mode settings above:

# params.tokenMode=manual
# params.jwtToken=eyJhbGciOiJIUzI1NiJ9.eyJpZCI6ImExYjJjM2Q0...
#
# How to get a token:
# curl -k -X POST "https://your-server.com/api/auth/token/generate" \
#   -H "Content-Type: application/json" \
#   -d '{"username":"your_username","password":"your_password","expirationMinutes":43200}'
#
# Then copy the token from the response and paste it above
# Use the SAME token on all your computers


# ==============================================================================
# ADVANCED SETTINGS (OPTIONAL)
# ==============================================================================

# Logging level (default: INFO)
# logging.level.com.illiad.proxy=DEBUG

# Connection timeouts (milliseconds)
# Not typically needed, use defaults

# Custom local bind address (default: 127.0.0.1)
# params.localHost=127.0.0.1

# UDP settings
# params.udpHost=127.0.0.1


# ==============================================================================
# NOTES
# ==============================================================================
# 
# Configuration Priority (highest to lowest):
# 1. Command line: -Dusername=alice -Dpassword=pass123
# 2. Environment variables: export username=alice
# 3. This file: application.properties
#
# Security Tips:
# - Use strong passwords
# - Protect this file with appropriate permissions: chmod 600 application.properties
# - Consider using environment variables for passwords in production
# - Never commit passwords to version control
#
# For more information, see:
# - doc/JWT_QUICK_REFERENCE.md - Quick start guide
# - doc/JWT_AUTO_MANAGEMENT.md - Complete user guide

