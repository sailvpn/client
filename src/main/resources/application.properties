spring.application.name=proxy
proxy.ssl.trust-store-type=PKCS12
proxy.ssl.trust-store=classpath:server.p12
proxy.ssl.trust-store-password=changeit
proxy.ssl.trust-alias=selfsigned

# JWT Authentication Configuration
# To use JWT authentication with the remote server:
# 1. Set params.crypto=JWT
# 2. Either:
#    a) Set params.jwtToken to your JWT token obtained from the server (manual), OR
#    b) Set params.username and params.password for automatic token acquisition
#
# Manual token configuration (option a):
#   params.crypto=JWT
#   params.jwtToken=eyJhbGciOiJIUzI1NiJ9.eyJpZCI6ImExYjJjM2Q0LWU1ZjYtNzg5MC1hYmNkLWVmMTIzNDU2Nzg5MCIsImV4cGlyZXNBdCI6MTczNTg2MjQwMDAwMH0.Xh7j9K2mN4pQ6rS8tU0vW1xY2zA3bC4dE5fF6gG7hH8
#
# Automatic token acquisition (option b - recommended):
#   params.crypto=JWT
#   params.username=alice
#   params.password=SecurePassword123!
#   params.remoteHost=your-server.com
#   params.remotePort=443
#
# Token management settings (optional):
#   params.tokenExpirationMinutes=43200        # 30 days (default)
#   params.tokenRenewalEnabled=true            # Enable automatic renewal (default: true)
#   params.tokenRenewalIntervalMinutes=10      # Renew every 10 minutes (default: 10)

